[project]
name = "msdis"
version = "1.0"
description = "Multi-shot ASP dispute-based ABA solver."
authors = [
    {name = "Piotr Gorczyca", email = "piotr.gorczyca@tu-dresden.de"},
    {name = "Martin Diller", email = "martin.diller@tu-dresden.de"},
]
dependencies = [
    "clingo>=5.6.2",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[project.scripts]
msdis = "msdis.__main__:main"
