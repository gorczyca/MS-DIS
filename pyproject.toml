[project]
name = "msdis"
version = "1"
description = "Default template for PDM package"
authors = [
    {name = "Piotr Gorczyca", email = "piotr.gorczyca@tu-dresden.de"},
    {name = "Martin Diller", email = "martin.diller@tu-dresden.de"},
]
dependencies = [
    "clingo>=5.6.2",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.package]
include = [
    { path = "src/msdis/encoding", format = "package" },
]

[project.scripts]
msdis = "msdis.__main__:main"
